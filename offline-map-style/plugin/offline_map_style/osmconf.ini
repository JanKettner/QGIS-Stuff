# Das Plugin ersetzt den folgenden Platzhalter abhängig von der GDAL-Version
# durch [general] (GDAL >= 3.10) oder eine Leerzeile (ältere Versionen).
__GENERAL_SECTION__
closed_ways_are_polygons=aeroway,amenity,boundary,building,craft,geological,historic,landuse,leisure,military,natural,office,place,shop,sport,tourism,highway=platform,public_transport=platform

[points]
attributes=name,place,amenity,tourism,shop,railway,highway,natural
unsignificant=created_by,converted_by,source,time,ele
other_tags=no

[lines]
attributes=name,ref,highway,railway,waterway,natural,boundary,admin_level,route,network,access,foot,bicycle,bridge,tunnel,oneway,surface,service
unsignificant=created_by,converted_by,source,time,ele
other_tags=no

[multipolygons]
attributes=name,type,building,landuse,natural,leisure,amenity,tourism,water,waterway,place
unsignificant=created_by,converted_by,source,time,ele
other_tags=no

[multilinestrings]
attributes=name,ref,highway,railway,waterway,natural,boundary,admin_level,route,network,access,foot,bicycle,bridge,tunnel,oneway,surface,service
unsignificant=created_by,converted_by,source,time,ele
other_tags=no

[other_relations]
attributes=name,type,ref,route,boundary
unsignificant=created_by,converted_by,source,time,ele
other_tags=no
